<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="740" viewBox="0 0 1100 740"><rect width="100%" height="100%" fill="#f4f7fa"/><style>text{font-family:Arial,sans-serif;fill:#17344a}.title{font-size:25px;font-weight:bold}.head{font-size:18px;font-weight:bold;fill:white}.body{font-size:15px}.label{font-size:14px}</style><text x="35" y="40" class="title">PayFlow relational model - authoritative financial records</text><path d="M320,160 L465,160" stroke="#4d7187" stroke-width="2" fill="none"/><text x="355" y="145" class="label">1 to 0..1</text><path d="M620,260 L620,360" stroke="#4d7187" stroke-width="2" fill="none"/><text x="635" y="305" class="label">wallet 1 to many entries</text><path d="M320,425 L465,425" stroke="#4d7187" stroke-width="2" fill="none"/><text x="335" y="410" class="label">1 to exactly 2</text><path d="M170,570 L170,630" stroke="#4d7187" stroke-width="2" fill="none"/><text x="185" y="610" class="label">1 to 1 event</text><path d="M465,235 L320,360" stroke="#4d7187" stroke-width="2" fill="none"/><text x="80" y="295" class="label">wallet 1 to many sent / received</text><rect x="35" y="85" width="285" height="160" rx="8" fill="white" stroke="#89a0af"/><path d="M43,85H312Q320,85 320,93V121H35V93Q35,85 43,85" fill="#153e56"/><text x="49" y="110" class="head">CUSTOMERS</text><text x="49" y="146" class="body">PK customer_id</text><text x="49" y="169" class="body">full_name</text><text x="49" y="192" class="body">UNIQUE email</text><text x="49" y="215" class="body">created_at</text><rect x="465" y="85" width="300" height="180" rx="8" fill="white" stroke="#89a0af"/><path d="M473,85H757Q765,85 765,93V121H465V93Q465,85 473,85" fill="#153e56"/><text x="479" y="110" class="head">WALLETS</text><text x="479" y="146" class="body">PK wallet_id</text><text x="479" y="169" class="body">FK customer_id (nullable)</text><text x="479" y="192" class="body">kind: customer | clearing</text><text x="479" y="215" class="body">currency: NGN</text><text x="479" y="238" class="body">UNIQUE customer_id, currency</text><rect x="35" y="355" width="285" height="215" rx="8" fill="white" stroke="#89a0af"/><path d="M43,355H312Q320,355 320,363V391H35V363Q35,355 43,355" fill="#153e56"/><text x="49" y="380" class="head">TRANSFERS</text><text x="49" y="416" class="body">PK transfer_id; UNIQUE key</text><text x="49" y="439" class="body">FK sender_id / receiver_id</text><text x="49" y="462" class="body">amount NUMERIC(18,2)</text><text x="49" y="485" class="body">posted; created_at</text><text x="49" y="508" class="body">FK UNIQUE reversal_of</text><text x="49" y="531" class="body">reversal: 0..1 per original</text><rect x="465" y="355" width="300" height="175" rx="8" fill="white" stroke="#89a0af"/><path d="M473,355H757Q765,355 765,363V391H465V363Q465,355 473,355" fill="#153e56"/><text x="479" y="380" class="head">LEDGER ENTRIES</text><text x="479" y="416" class="body">PK entry_id</text><text x="479" y="439" class="body">FK transfer_id / wallet_id</text><text x="479" y="462" class="body">signed amount NUMERIC(18,2)</text><text x="479" y="485" class="body">UNIQUE transfer_id, wallet_id</text><rect x="35" y="630" width="730" height="90" rx="8" fill="white" stroke="#89a0af"/><path d="M43,630H757Q765,630 765,638V666H35V638Q35,630 43,630" fill="#153e56"/><text x="49" y="655" class="head">OUTBOX EVENTS</text><text x="49" y="691" class="body">PK event_id; FK UNIQUE transfer_id; type; JSON payload; timestamps</text><text x="800" y="120" class="body">Commit invariants:</text><text x="800" y="150" class="body">Debit + credit = 0</text><text x="800" y="180" class="body">No customer overdrafts</text><text x="800" y="210" class="body">Immutable money history</text><text x="800" y="240" class="body">Ordered wallet locks</text><text x="800" y="290" class="body">Balance is a derived view.</text><text x="800" y="325" class="body">Clearing has no customer</text><text x="800" y="350" class="body">and may be negative.</text></svg>
