<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><rect width="100%" height="100%" fill="#ffffff"/><style>text{font-family:Arial,sans-serif;fill:#000000}.title{font-size:25px;font-weight:bold}.head{font-size:18px;font-weight:bold;fill:black}.body{font-size:15px}.label{font-size:14px}</style><text x="35" y="40" class="title">PayFlow local implementation and proposed extensions</text><path d="M280,155 L420,155" stroke="#000000" stroke-width="2" fill="none"/><text x="320" y="140" class="label">calls</text><path d="M700,155 L830,155" stroke="#000000" stroke-width="2" fill="none"/><text x="720" y="140" class="label">async probe</text><path d="M560,225 L560,320" stroke="#000000" stroke-width="2" fill="none"/><text x="575" y="280" class="label">atomic event row</text><path d="M700,385 L830,385" stroke="#000000" stroke-width="2" fill="none"/><text x="710" y="365" class="label">proposed delivery</text><rect x="35" y="100" width="245" height="125" rx="8" fill="white" stroke="#000000"/><path d="M43,100H272Q280,100 280,108V136H35V108Q35,100 43,100" fill="white"/><text x="49" y="125" class="head">APPLICATION</text><text x="49" y="161" class="body">Customers / operations</text><text x="49" y="184" class="body">SELECT + function EXECUTE</text><rect x="420" y="100" width="280" height="125" rx="8" fill="white" stroke="#000000"/><path d="M428,100H692Q700,100 700,108V136H420V108Q420,100 428,100" fill="white"/><text x="434" y="125" class="head">POSTGRESQL PRIMARY</text><text x="434" y="161" class="body">Ledger and transfer authority</text><text x="434" y="184" class="body">Local container, port 55432</text><rect x="830" y="100" width="245" height="125" rx="8" fill="white" stroke="#000000"/><path d="M838,100H1067Q1075,100 1075,108V136H830V108Q830,100 838,100" fill="white"/><text x="844" y="125" class="head">LOGICAL SUBSCRIBER</text><text x="844" y="161" class="body">Probe table only</text><text x="844" y="184" class="body">Local container, port 55433</text><rect x="420" y="320" width="280" height="125" rx="8" fill="white" stroke="#000000"/><path d="M428,320H692Q700,320 700,328V356H420V328Q420,320 428,320" fill="white"/><text x="434" y="345" class="head">TRANSACTIONAL OUTBOX</text><text x="434" y="381" class="body">Implemented event records</text><text x="434" y="404" class="body">Consumer not implemented</text><rect x="830" y="320" width="245" height="125" rx="8" fill="white" stroke="#000000"/><path d="M838,320H1067Q1075,320 1075,328V356H830V328Q830,320 838,320" fill="white"/><text x="844" y="345" class="head">MONGODB</text><text x="844" y="381" class="body">Supplementary risk events</text><text x="844" y="404" class="body">Seeded by verification script</text><text x="35" y="510" class="body">Verified: transaction integrity, MongoDB CRUD/validation, asynchronous probe propagation and catch-up.</text><text x="35" y="545" class="body">Proposed only: production event consumer, cross-zone cloud HA, fenced failover, TLS, backups and PITR.</text><text x="35" y="580" class="body">The local subscriber is not a physical standby. All containers share one host; no host-failure resilience is claimed.</text></svg>
